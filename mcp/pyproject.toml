[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organize-files-mcp"
version = "1.0.0"
description = "MCP server for licensed OrganizeFiles.Cli diagnostics (customer AI assistants)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.6.0,<2"]

[project.scripts]
organize-files-mcp = "organize_files_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["organize_files_mcp*"]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".pytest_cache",
  ".pytest-tmp",
  "Users*AppDataLocalTemp*",
  "Users*pytest*",
]
